services:
  extractor:
    build: .
    image: devtools-extractor:latest
    container_name: devtools-extractor
    # dashboard only on this machine: it drives a browser and serves the output folder
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - extractor-data:/data
    environment:
      # knowledge graph: sessions are synced into Neo4j when they finish
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-extractor-graph}
      # long-term storage: structured data in PostgreSQL, session files in SeaweedFS (S3 API)
      DATABASE_URL: postgres://extractor:${POSTGRES_PASSWORD:-extractor-db}@postgres:5432/extractor
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-extractor}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-extractor-files}
      S3_BUCKET: extractor
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: "1gb"
    # reaps Chromium child processes and forwards signals
    init: true
    restart: unless-stopped

  # official Neo4j image (Docker Hub "neo4j", Community Edition)
  neo4j:
    image: neo4j:2026.10.0-community
    container_name: devtools-extractor-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-extractor-graph}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    # Neo4j Browser (7474) and Bolt (7687), only on this machine
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # official PostgreSQL image
  postgres:
    image: postgres:18.6
    container_name: devtools-extractor-postgres
    environment:
      POSTGRES_USER: extractor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extractor-db}
      POSTGRES_DB: extractor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep the data under /var/lib/postgresql/<version>
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractor -d extractor"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # official SeaweedFS image: master + volume + filer + S3 gateway in one process
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: devtools-extractor-seaweedfs
    # volume.max=0: as many volumes as the disk allows (every bucket gets its own volumes)
    command: server -dir=/data -s3 -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      # admin identity of the S3 gateway
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-extractor}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-extractor-files}
    # S3 API (8333) and filer UI (8888), only on this machine
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  extractor-data:
  neo4j-data:
  postgres-data:
  seaweedfs-data:
